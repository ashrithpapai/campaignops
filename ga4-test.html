<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CampaignOps GA4 test page</title>
  <script>
    // ===== Paste your GA4 Measurement ID here (it starts with "G-"). This is the ONLY line to edit. =====
    const MEASUREMENT_ID = 'G-XXXXXXXXXX';
    // ======================================================================================================
    const READY = /^G-[A-Z0-9]{6,}$/.test(MEASUREMENT_ID) && MEASUREMENT_ID !== 'G-XXXXXXXXXX';
    if (READY) {
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(MEASUREMENT_ID);
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', MEASUREMENT_ID);
    }
  </script>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #0f172a; line-height: 1.5; }
    .box { border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px 16px; margin: 16px 0; }
    .ok { background: #ecfdf5; border-color: #86efac; }
    .warn { background: #fffbeb; border-color: #fcd34d; }
    code { background: #f1f5f9; padding: 1px 6px; border-radius: 4px; word-break: break-all; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    td { border-bottom: 1px solid #e2e8f0; padding: 6px 8px; vertical-align: top; word-break: break-all; }
  </style>
</head>
<body>
  <h1>CampaignOps GA4 test page</h1>
  <p>This page exists only to check CampaignOps' GA4 channel predictions against real GA4 data. It has no content and collects nothing beyond what GA4 itself records.</p>
  <div id="status" class="box"></div>
  <h2>Tags this visit arrived with</h2>
  <div class="box"><table id="tags"></table></div>
  <script>
    const status = document.getElementById('status');
    if (READY) { status.className = 'box ok'; status.textContent = 'GA4 is active on this page (ID ' + MEASUREMENT_ID + ').'; }
    else { status.className = 'box warn'; status.textContent = 'GA4 is not set up yet: paste your Measurement ID into the MEASUREMENT_ID line of this file.'; }
    const rows = [];
    new URLSearchParams(location.search).forEach((v, k) => rows.push([k, v]));
    const t = document.getElementById('tags');
    if (!rows.length) { const tr = t.insertRow(); tr.insertCell().textContent = 'No tags in this visit\'s link.'; }
    rows.forEach(([k, v]) => { const tr = t.insertRow(); tr.insertCell().textContent = k; tr.insertCell().textContent = v; });
  </script>
</body>
</html>
